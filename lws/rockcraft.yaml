# Based on https://github.com/kubernetes-sigs/lws/blob/v0.7.0/Dockerfile
name: lws
summary: LeaderWorkerSet controller
description: "LeaderWorkerSet (LWS) controller manager"
version: "0.7.0"
license: Apache-2.0
base: ubuntu@24.04
platforms:
    amd64:
run-user: _daemon_

services:
  lws:
    override: replace
    summary: "LeaderWorkerSet controller manager service"
    startup: enabled
    command: "/manager"

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
      dpkg-query --root=${CRAFT_PROJECT_DIR}/../bundles/ubuntu-24.04/rootfs/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) \
      > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  lws:
    plugin: go
    source: https://github.com/kubernetes-sigs/lws
    source-type: git
    source-tag: v0.7.0
    build-snaps:
      - go/1.24/stable
    build-environment:
      - CGO_ENABLED: "0"
      - GOOS: linux
      - GIT_TAG: v0.7.0 # on the original repo and branch run $(git describe --abbrev=0)
      - GIT_COMMIT: cd3a73a3f5e00cfa9cd2c1c92f00f6189d88073e  # on the original repo and branch run $(git rev-parse HEAD)
    override-build: |
      go mod download

      version_pkg = sigs.k8s.io/lws/pkg/version
      LD_FLAGS += -X '$(version_pkg).GitVersion=$(GIT_TAG)'
      LD_FLAGS += -X '$(version_pkg).GitCommit=$(shell git rev-parse HEAD)'

      # Build the manager binary, as done by `make build` in the upstream
      # Dockerfile (go build -o bin/manager cmd/main.go).
      go build -a -o manager -ldflags "$LD_FLAGS" ./cmd

      # Copy the files to the install directory
      cp -r manager $CRAFT_PART_INSTALL/manager
