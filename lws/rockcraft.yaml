# Based on https://github.com/kubernetes-sigs/lws/blob/v0.7.0/Dockerfile
name: lws
summary: LeaderWorkerSet controller
description: "LeaderWorkerSet (LWS) controller manager"
version: "0.7.0"
license: Apache-2.0
base: ubuntu@22.04
platforms:
    amd64:
run-user: _daemon_

services:
  lws:
    override: replace
    summary: "LeaderWorkerSet controller manager service"
    startup: enabled
    command: "/manager"

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
      dpkg-query --root=${CRAFT_PROJECT_DIR}/../bundles/ubuntu-22.04/rootfs/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) \
      > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  lws:
    plugin: go
    source: https://github.com/kubernetes-sigs/lws
    source-type: git
    source-tag: v0.7.0
    build-snaps:
      - go/1.24/stable
    build-environment:
      - CGO_ENABLED: "0"
      - GOOS: linux
    override-build: |
      go mod download

      # Build the manager binary, as done by `make build` in the upstream
      # Dockerfile (go build -o bin/manager cmd/main.go).
      go build -a -o manager ./cmd

      # Generate third-party licenses
      cp -r $CRAFT_PART_SRC/LICENSE ./LICENSE
      go install github.com/google/go-licenses@latest
      $GOBIN/go-licenses check ./cmd/... ./pkg/... ./api/... --disallowed_types="forbidden,unknown"
      $GOBIN/go-licenses save --save_path third_party/library ./cmd

      # Copy the files to the install directory
      mkdir $CRAFT_PART_INSTALL/third_party
      cp -r third_party $CRAFT_PART_INSTALL/third_party/
      cp -r manager $CRAFT_PART_INSTALL/manager
