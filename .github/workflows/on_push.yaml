name: On Push

on:
  push:
    branches:
    - main
    - track/**
    - kf-8939-hrcr-test-run

jobs:

  on-push:
    uses: canonical/charmed-kubeflow-workflows/.github/workflows/get-rocks-modified-and-build-scan-test-publish.yaml@kf-8939-upload-ghcr
    permissions:
      pull-requests: read
    secrets: inherit
    with:
      microk8s-channel: 1.32-strict/stable
      juju-channel: 3.6/stable
      python-version: "3.8"
      rockcraft-channel: latest/stable
