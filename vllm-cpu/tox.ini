[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = fmt, lint, pack, export-to-docker, sanity, integration

[vars]
tst_path = {toxinidir}/tests/

[flake8]
max-line-length = 99


[testenv]
setenv =
    PYTHONPATH={toxinidir}
    PYTHONBREAKPOINT=ipdb.set_trace
    CHARM_REPO=https://github.com/canonical/kserve-operators.git
    CHARM_BRANCH=main
    LOCAL_CHARM_DIR=charm_repo

[testenv:fmt]
deps =
    isort
    black
commands =
	isort {[vars]tst_path}
	black {[vars]tst_path}
description = Apply coding style standards to code
skip_install = true

[testenv:lint]
deps =
    flake8
    isort
    black
commands =
	flake8 {[vars]tst_path}
	isort --check-only --diff {[vars]tst_path}
	black --check --diff {[vars]tst_path}
description = Check code against coding style standards
skip_install = true


[testenv:pack]
passenv = *
allowlist_externals =
    rockcraft
commands =
    rockcraft pack

[testenv:export-to-docker]
passenv = *
allowlist_externals =
    bash
    rockcraft
    yq
commands =
    # pack rock and export to docker
    bash -c 'NAME=$(yq eval .name rockcraft.yaml) && \
             VERSION=$(yq eval .version rockcraft.yaml) && \
             ARCH=$(yq eval ".platforms | keys | .[0]" rockcraft.yaml) && \
             ROCK="$\{NAME\}_$\{VERSION\}_$\{ARCH\}.rock" && \
             DOCKER_IMAGE=$NAME:$VERSION && \
             echo "Exporting $ROCK to docker as $DOCKER_IMAGE" && \
             rockcraft.skopeo --insecure-policy copy oci-archive:$ROCK docker-daemon:$DOCKER_IMAGE'

[testenv:sanity]
passenv = *
deps =
    pytest
    charmed-kubeflow-chisme
commands =
    # run rock tests (exclude integration tests that require a running server)
    pytest -s -v --tb native --show-capture=all --log-cli-level=INFO {posargs} {toxinidir}/tests

[testenv:integration]
passenv = *
allowlist_externals =
    echo
commands =
    # TODO: Implement integration tests here
    echo "WARNING: This is a placeholder test - no test is implemented here."